name: Agent MTB Forecaster — Debug Trilhas

on:
  workflow_dispatch:
    inputs:
      trilha_id:
        description: "UUID da trilha (ex: 5006ffe5-4a37-4bb3-bc55-44be00e36989)"
        required: true
        default: ""
      debug_model:
        description: "Ativar DEBUG_MODEL"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # GH_DISPATCH_TOKEN, TELEGRAM_BOT_TOKEN e SEND_EMAIL_SECRET ausentes
      # intencionalmente — nenhuma notificação será disparada
      OPENWEATHER_API_KEY:       ${{ secrets.OPENWEATHER_API_KEY }}
      ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_URL:              https://eydlkvrjopffyqpdstzh.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      WEATHERAPI_KEY:            ${{ secrets.WEATHERAPI_KEY }}
      WINDY_API_KEY:             ${{ secrets.WINDY_API_KEY }}
      DEBUG_MODEL:               ${{ github.event.inputs.debug_model }}
      TRILHA_DEBUG:              ${{ github.event.inputs.trilha_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run Agent — Debug
        run: python mtb-forecast.py 2>&1 | tee debug_$(date +%Y-%m-%d_%H%M).log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ github.run_id }}
          path: debug_*.log
          retention-days: 7

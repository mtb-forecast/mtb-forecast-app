name: MTB Telegram Notifications

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-telegram:
    runs-on: ubuntu-latest

    env:
      SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_URL:              https://eydlkvrjopffyqpdstzh.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Send Telegram notifications
        run: python mtb_telegram.py 2>&1 | tee debug_telegram_$(date +%Y-%m-%d).log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-telegram-${{ github.run_id }}
          path: debug_telegram_*.log
          retention-days: 7

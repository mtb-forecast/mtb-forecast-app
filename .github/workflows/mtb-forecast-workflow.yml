name: Agent MTB Forecaster

on:
  schedule:
  - cron: "0 9 * * *"      # 06h BRT — todos os dias (Seg–Dom)
  - cron: "0 15 * * 5,6,0" # 12h BRT — Sex, Sáb, Dom
  - cron: "0 23 * * 5,6"   # 20h BRT — Sex e Sáb
    
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      OPENWEATHER_API_KEY:      ${{ secrets.OPENWEATHER_API_KEY }}
      ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_URL:             https://eydlkvrjopffyqpdstzh.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
      RESEND_API_KEY:           ${{ secrets.RESEND_API_KEY }}
      SEND_EMAIL_SECRET:        ${{ secrets.SEND_EMAIL_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run Agent MTB Forecaster
        run: python mtb-forecast.py 2>&1 | tee debug_$(date +%Y-%m-%d).log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ github.run_id }}
          path: debug_*.log
          retention-days: 30

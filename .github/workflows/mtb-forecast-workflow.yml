name: Agent MTB Forecaster

on:
  schedule:
  # Ao alterar horários aqui, atualize também lib/schedule.ts (usado na UI do site)
  - cron: "0 9 * * *"      # 06h BRT — todos os dias (Seg–Dom)
  - cron: "0 19 * * *"     # 16h BRT — todos os dias (captura chuvas da tarde)
  - cron: "0 15 * * 5,6,0" # 12h BRT — Sex, Sáb, Dom
  - cron: "0 23 * * 5,6"   # 20h BRT — Sex e Sáb
    
  workflow_dispatch:
    inputs:
      debug_model:
        description: "Ativar DEBUG_MODEL"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      OPENWEATHER_API_KEY:      ${{ secrets.OPENWEATHER_API_KEY }}
      ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY:         ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
      SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_URL:             https://eydlkvrjopffyqpdstzh.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_TELEGRAM_CHAT_ID:   ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
      SEND_EMAIL_SECRET:        ${{ secrets.SEND_EMAIL_SECRET }}
      WEATHERAPI_KEY:           ${{ secrets.WEATHERAPI_KEY }}
      GH_DISPATCH_TOKEN:        ${{ secrets.GH_DISPATCH_TOKEN }}
      DEBUG_MODEL:              ${{ github.event.inputs.debug_model }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run Agent MTB Forecaster
        run: python mtb-forecast.py 2>&1 | tee debug_$(date +%Y-%m-%d).log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ github.run_id }}
          path: debug_*.log
          retention-days: 30

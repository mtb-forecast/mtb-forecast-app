name: Agent MTB Forecaster

on:
  schedule:
    - cron: "0 8 * * *"   # 05:00 BRT todos os dias
    - cron: "0 0 * * 6"   # Sexta às 21:00 BRT (sábado 00:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      OPENWEATHER_API_KEY:  ${{ secrets.OPENWEATHER_API_KEY }}
      ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_URL:         https://eydlkvrjopffyqpdstzh.supabase.co

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Agent MTB Forecaster
        run: python mtb-forecast.py 2>&1 | tee debug_$(date +%Y-%m-%d).log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ github.run_id }}
          path: debug_*.log
          retention-days: 30

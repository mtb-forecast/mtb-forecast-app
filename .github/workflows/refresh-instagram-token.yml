name: Renovar Token Instagram

on:
  # Roda no dia 1 de cada mês às 10h UTC — token dura 60 dias, renovação mensal é segura
  schedule:
    - cron: "0 10 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install requests

      - name: Renovar token
        env:
          META_APP_ID:             ${{ secrets.META_APP_ID }}
          META_APP_SECRET:         ${{ secrets.META_APP_SECRET }}
          INSTAGRAM_ACCESS_TOKEN:  ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          # Executa o script e captura o novo token da última linha (NEW_TOKEN=...)
          python scripts/refresh_instagram_token.py | tee /tmp/refresh_output.txt
          grep "^NEW_TOKEN=" /tmp/refresh_output.txt | sed 's/^NEW_TOKEN=//' > /tmp/new_token.txt
          if [ ! -s /tmp/new_token.txt ]; then
            echo "✗ Novo token não encontrado na saída do script"
            exit 1
          fi
          echo "✓ Novo token capturado"

      - name: Atualizar secret INSTAGRAM_ACCESS_TOKEN no GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          gh secret set INSTAGRAM_ACCESS_TOKEN < /tmp/new_token.txt
          echo "✅ Secret INSTAGRAM_ACCESS_TOKEN atualizado com sucesso!"

      - name: Limpar arquivo temporário
        if: always()
        run: rm -f /tmp/new_token.txt /tmp/refresh_output.txt

      - name: Alertar falha via Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_CHAT_ID:  ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$ADMIN_TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN ou ADMIN_TELEGRAM_CHAT_ID ausente — alerta não enviado"
            exit 0
          fi
          MSG=$(printf '🔴 <b>Renovar Token Instagram falhou</b>\n\nA renovação automática do token do Instagram nao funcionou. Verifique os logs:\nhttps://github.com/%s/actions/runs/%s\n\nSe o token ja expirou, gere um novo manualmente no Graph API Explorer e atualize o secret INSTAGRAM_ACCESS_TOKEN.' "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MSG}"

name: Reels Clima Extremo (Instagram)

# Transforma a notícia externa do dia (gerada por noticia-externa.yml) num
# Reels curto e publica no Instagram. INDEPENDENTE do pipeline principal e
# de noticia-externa.yml — só lê a linha mais recente já gravada por ele.
#
# Para desligar no futuro: desabilite este workflow na aba Actions do GitHub
# (Actions → Reels Clima Extremo → "..." → Disable workflow), ou apague este
# arquivo. Nenhuma outra parte do sistema depende dele.

on:
  schedule:
    - cron: "20 10 * * *"  # 07h20 BRT — 20min depois da notícia externa (07h BRT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN (gera o vídeo mas não sobe nem publica)"
        required: false
        default: false
        type: boolean
      instagram:
        description: "Publicar também no Instagram"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  reels-clima-extremo:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:                   https://eydlkvrjopffyqpdstzh.supabase.co
      SUPABASE_SERVICE_KEY:           ${{ secrets.SUPABASE_SERVICE_KEY }}
      OG_API_BASE:                    https://mtbforecaster.com.br
      INSTAGRAM_ACCESS_TOKEN:         ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      DRY_RUN:                        ${{ inputs.dry_run == true && '1' || '0' }}
      REELS_CLIMA_EXTREMO_INSTAGRAM:  ${{ inputs.instagram == false && '0' || '1' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install requests

      - name: Verificar ffmpeg
        run: ffmpeg -version

      - name: Gerar e publicar Reels de clima extremo
        run: python scripts/post_reels_clima_extremo.py

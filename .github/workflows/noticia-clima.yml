name: Notícia Climática (Visão Geral)

# Roda logo após o Agent MTB Forecaster terminar. É INDEPENDENTE do pipeline
# principal — não altera mtb-forecast-workflow.yml e não bloqueia o pipeline
# se falhar.
#
# Para desligar no futuro: basta desabilitar este workflow na aba Actions do
# GitHub (Actions → Notícia Climática → "..." → Disable workflow), ou apagar
# este arquivo. Nenhuma outra parte do sistema depende dele.

on:
  workflow_run:
    workflows: ["Agent MTB Forecaster"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN (não grava nem posta de verdade)"
        required: false
        default: false
        type: boolean
      instagram:
        description: "Postar também no Instagram"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  noticia:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:                  https://eydlkvrjopffyqpdstzh.supabase.co
      SUPABASE_SERVICE_KEY:          ${{ secrets.SUPABASE_SERVICE_KEY }}
      DEEPSEEK_API_KEY:              ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY:             ${{ secrets.ANTHROPIC_API_KEY }}
      OG_API_BASE:                   https://mtbforecaster.com.br
      INSTAGRAM_ACCESS_TOKEN:        ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      DRY_RUN:                       ${{ inputs.dry_run == true && '1' || '0' }}
      NOTICIA_CLIMA_INSTAGRAM:       ${{ inputs.instagram == false && '0' || '1' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar e publicar notícia climática
        run: python scripts/post_noticia_clima.py

name: Agent MTB Forecaster — Por Estado

on:
  workflow_dispatch:
    inputs:
      estado:
        description: 'Estado a processar (sigla UF)'
        required: true
        default: 'SP'
        type: choice
        options:
          - SP
          - MG
          - RJ
          - RS
          - PR
          - SC
          - ES
          - BA
          - GO
          - MS
          - MT
          - DF
          - PE
          - CE
          - PA
          - AM
          - MA
          - RN
          - PB
          - AL
          - SE
          - PI
          - TO
          - RO
          - AC
          - RR
          - AP

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    name: "Processar ${{ github.event.inputs.estado }}"

    env:
      DEBUG_MODEL:              "true"
      OPENWEATHER_API_KEY:       ${{ secrets.OPENWEATHER_API_KEY }}
      ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_URL:              https://eydlkvrjopffyqpdstzh.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SEND_EMAIL_SECRET:         ${{ secrets.SEND_EMAIL_SECRET }}
      WEATHERAPI_KEY:            ${{ secrets.WEATHERAPI_KEY }}
      GH_DISPATCH_TOKEN:         ${{ secrets.GH_DISPATCH_TOKEN }}
      MTB_ESTADO:                ${{ github.event.inputs.estado }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run Agent MTB Forecaster (${{ github.event.inputs.estado }})
        run: python mtb-forecast.py 2>&1 | tee debug_$(date +%Y-%m-%d)_${{ github.event.inputs.estado }}.log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ github.run_id }}-${{ github.event.inputs.estado }}
          path: debug_*.log
          retention-days: 30

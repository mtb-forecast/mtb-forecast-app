name: Instagram Dica do Dia

on:
  schedule:
    - cron: "30 9 * * *"  # 06h30 BRT — diário
  workflow_dispatch:
    inputs:
      dica_id:
        description: "ID da dica (1–7). Deixe vazio para rotação automática."
        required: false
        default: ""
      dry_run:
        description: "DRY RUN (não posta de verdade)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dica:
    runs-on: ubuntu-latest

    env:
      OG_API_BASE:                   https://mtbforecaster.com.br
      INSTAGRAM_ACCESS_TOKEN:        ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      DICA_ID:                       ${{ inputs.dica_id }}
      DRY_RUN:                       ${{ inputs.dry_run == true && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install requests

      - name: Postar dica do dia no Feed
        run: python scripts/post_instagram_dica.py

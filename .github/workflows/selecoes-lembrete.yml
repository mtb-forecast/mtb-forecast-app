name: Seleções de Trilhas — Lembrete D-1

on:
  schedule:
    - cron: "0 9 * * *"  # 06h00 BRT — diário, antes da janela das 07h do pipeline principal
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY RUN (só imprime, não envia Telegram)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lembrete-selecoes:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL:              https://eydlkvrjopffyqpdstzh.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Notificar seleções de amanhã
        run: |
          python scripts/notificar_selecoes.py ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            2>&1 | tee debug_selecoes_$(date +%Y-%m-%d).log

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-selecoes-${{ github.run_id }}
          path: debug_selecoes_*.log
          retention-days: 7
